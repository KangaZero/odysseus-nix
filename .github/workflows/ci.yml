name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required-status-check names for branch protection (one per Nix system):
#   "test (ubuntu-latest)"    → x86_64-linux
#   "test (ubuntu-24.04-arm)" → aarch64-linux
#   "test (macos-13)"         → x86_64-darwin //Temporarily commenting this out, as it does not seem to be retrievable
#   "test (macos-latest)"     → aarch64-darwin
# Mark them required in repo settings to block merges/pushes that don't pass.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # One runner per Nix system, so each of the flake's four supported
        # systems is built and tested natively (no cross-compilation):
        #   ubuntu-latest    → x86_64-linux
        #   ubuntu-24.04-arm → aarch64-linux
        #   macos-13         → x86_64-darwin (Intel) //Removed out temporarily, might need to try a different version
        #   macos-latest     → aarch64-darwin (Apple Silicon)
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Show host system
        run: nix eval --impure --raw --expr builtins.currentSystem

      - name: just test (fmt-check + lint + check + build)
        run: nix develop --command just test
