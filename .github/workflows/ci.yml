name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required-status-check names for branch protection (one per matrix leg):
#   "test (ubuntu-latest)"    → x86_64-linux
#   "test (ubuntu-24.04-arm)" → aarch64-linux
#   "test (macos-latest)"     → aarch64-darwin
# Mark them required in repo settings to block merges/pushes that don't pass.
# NOTE: there is no x86_64-darwin (macos-13) leg and there should not be one:
# nixpkgs 26.11 dropped the platform, so the flake filters it out of its system
# list. Never mark a check that never runs as required — it would block every
# merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # One runner per Nix system in the matrix, each built and tested
        # natively (no cross-compilation):
        #   ubuntu-latest    → x86_64-linux
        #   ubuntu-24.04-arm → aarch64-linux
        #   macos-latest     → aarch64-darwin (Apple Silicon)
        # x86_64-darwin (macos-13, Intel) is gone for good — nixpkgs 26.11
        # dropped the platform, so the flake no longer targets it.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Show host system
        run: nix eval --impure --raw --expr builtins.currentSystem

      - name: just test (fmt-check + lint + check + build)
        run: nix develop --command just test
